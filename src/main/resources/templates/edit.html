<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Job</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h1>Edit Application</h1>

<form th:action="@{/edit/{id}(id=${job.id})}" th:object="${job}" method="post">
    <div class="mb-3">
        <label>Company</label>
        <input type="text" class="form-control" th:field="*{company}" required>
    </div>
    <div class="mb-3">
        <label>Role</label>
        <input type="text" class="form-control" th:field="*{role}" required>
    </div>
    <div class="mb-3">
        <label>Status</label>
        <select class="form-control" th:field="*{status}">
            <option value="Applied">Applied</option>
            <option value="Interview">Interview</option>
            <option value="Offer">Offer</option>
            <option value="Rejected">Rejected</option>
        </select>
    </div>
    <div class="mb-3">
        <label>Date Applied</label>
        <input type="date" class="form-control" th:field="*{dateApplied}" required>
    </div>
    <div class="mb-3">
        <label>Notes</label>
        <textarea class="form-control" th:field="*{notes}"></textarea>
    </div>
    <div class="mb-3">
        <label>Job URL</label>
        <input type="text" class="form-control" th:field="*{url}" required>
    </div>
    <button type="submit" class="btn btn-success">Save Changes</button>
    <a href="/" class="btn btn-secondary">Cancel</a>
</form>

</body>
</html>
