<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Job Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h1>📋 Job Applications</h1>
<div class="d-flex justify-content-between align-items-center mb-3">
    <a href="/add" class="btn btn-primary">+ Add Application</a>
    <form method="get" action="/" class="d-flex gap-2">
        <input type="text" name="search" class="form-control"
               placeholder="Search by company..." th:value="${search}">
        <button type="submit" class="btn btn-outline-primary">Search</button>
        <a href="/" class="btn btn-outline-secondary">Clear</a>
    </form>
</div>
<div class="row mb-4">
    <div class="col">
        <div class="card text-white bg-secondary">
            <div class="card-body text-center">
                <h5>Total</h5>
                <h2 th:text="${totalCount}"></h2>
            </div>
        </div>
    </div>
    <div class="col">
        <div class="card text-white bg-primary">
            <div class="card-body text-center">
                <h5>Applied</h5>
                <h2 th:text="${appliedCount}"></h2>
            </div>
        </div>
    </div>
    <div class="col">
        <div class="card text-white bg-warning">
            <div class="card-body text-center">
                <h5>Interview</h5>
                <h2 th:text="${interviewCount}"></h2>
            </div>
        </div>
    </div>
    <div class="col">
        <div class="card text-white bg-success">
            <div class="card-body text-center">
                <h5>Offer</h5>
                <h2 th:text="${offerCount}"></h2>
            </div>
        </div>
    </div>
    <div class="col">
        <div class="card text-white bg-danger">
            <div class="card-body text-center">
                <h5>Rejected</h5>
                <h2 th:text="${rejectedCount}"></h2>
            </div>
        </div>
    </div>
</div>

<table class="table table-bordered">
    <thead>
    <tr>
        <th>Company</th>
        <th>Role</th>
        <th>Status</th>
        <th>Date Applied</th>
        <th>Notes</th>
        <th>Actions</th>
        <th>URL</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="job : ${jobs}">
        <td th:text="${job.company}"></td>
        <td th:text="${job.role}"></td>
        <td>
            <span th:if="${job.status == 'Applied'}" class="badge bg-primary">Applied</span>
            <span th:if="${job.status == 'Interview'}" class="badge bg-warning text-dark">Interview</span>
            <span th:if="${job.status == 'Offer'}" class="badge bg-success">Offer</span>
            <span th:if="${job.status == 'Rejected'}" class="badge bg-danger">Rejected</span>
        </td>
        <td th:text="${job.dateApplied}"></td>
        <td th:text="${job.notes}"></td>
        <td>
            <a th:if="${job.url != null and job.url != ''}"
               th:href="${job.url}"
               target="_blank">View Job</a>
            <span th:if="${job.url == null or job.url == ''}">—</span>
        </td>
        <td>
            <a th:href="@{/edit/{id}(id=${job.id})}" class="btn btn-warning btn-sm">Edit</a>
            <a th:href="@{/delete/{id}(id=${job.id})}" class="btn btn-danger btn-sm">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
